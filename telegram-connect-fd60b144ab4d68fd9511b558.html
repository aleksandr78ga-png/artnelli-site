<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0d0b09">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; img-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Безопасное подключение Telegram — Art Nelli</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0b09;
      --panel: #151210;
      --ivory: #f2ead9;
      --muted: #a89e8c;
      --gold: #c9a96a;
      --line: rgba(242, 234, 217, 0.18);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--ivory);
    }

    main {
      width: min(100%, 520px);
      border: 1px solid var(--line);
      background: var(--panel);
      padding: clamp(24px, 7vw, 44px);
    }

    .brand {
      margin: 0 0 28px;
      color: var(--gold);
      font: 500 0.76rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 400 clamp(1.9rem, 8vw, 2.8rem)/1.05 Georgia, serif;
    }

    .intro {
      margin: 18px 0 28px;
      color: var(--muted);
      line-height: 1.55;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 500;
    }

    input,
    textarea,
    button {
      width: 100%;
      border-radius: 0;
      font: inherit;
    }

    input,
    textarea {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ivory);
      padding: 15px 16px;
      font-size: 16px;
    }

    input:focus,
    textarea:focus,
    button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    button {
      min-height: 52px;
      margin-top: 14px;
      border: 1px solid var(--ivory);
      background: var(--ivory);
      color: var(--bg);
      font-weight: 500;
      cursor: pointer;
    }

    button:disabled { opacity: 0.55; cursor: wait; }

    .secondary {
      border-color: var(--line);
      background: transparent;
      color: var(--ivory);
    }

    .note,
    #status {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    #status[data-state="error"] { color: #efb2a7; }
    #status[data-state="success"] { color: var(--gold); }

    #result-wrap[hidden] { display: none; }
    #result-wrap { margin-top: 28px; }
    textarea { min-height: 132px; resize: vertical; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Leotards by Nelli · Илон</p>
    <h1>Подключение Telegram</h1>
    <p class="intro">Вставьте токен бота. Он зашифруется прямо на этом телефоне и не будет отправлен на сайт.</p>

    <label for="bot-token">Токен от BotFather</label>
    <input id="bot-token" type="password" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="1234567890:…">
    <button id="encrypt" type="button">Создать безопасный код</button>
    <p class="note">Токен не сохраняется. После создания поле сразу очистится.</p>
    <p id="status" role="status" aria-live="polite"></p>

    <section id="result-wrap" hidden>
      <label for="encrypted-code">Безопасный код для Илона</label>
      <textarea id="encrypted-code" readonly spellcheck="false"></textarea>
      <button id="copy" class="secondary" type="button">Скопировать код</button>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const publicKeyBase64 = "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA5qXjTqEZ01oGDDsWE8uNClslhGLit5JqDByidvqkZQaZf7+RSkvFYWv4Nvte9vVh6iD/o2IAvtpY2RHdg0cZCRzF4ilBhInj7tZMX4PknaTo8iKjuA1ZddIB3euWFJZdN/osA6JEGlclyCKuK5McDjZuxr6KOcikk3imv0JRdKTyesxNT/91212tnBBk01jmiSi5DsyqYcyveZN7GDkjv9OVEHtXWKuUz26eX7r7+c2wbnJNggELHDoks47nliLEgc8yqHNwIefcIS9iHwgIUw8t2uI6VDXP//TiCMEKF+L7egmfEynTcXE2JIJSjLqH94jidaTIQ69XE+Jrcw6GZQIDAQAB";
      const tokenInput = document.getElementById("bot-token");
      const encryptButton = document.getElementById("encrypt");
      const copyButton = document.getElementById("copy");
      const resultWrap = document.getElementById("result-wrap");
      const result = document.getElementById("encrypted-code");
      const status = document.getElementById("status");

      function bytesFromBase64(value) {
        const decoded = atob(value);
        return Uint8Array.from(decoded, character => character.charCodeAt(0));
      }

      function base64FromBytes(bytes) {
        let binary = "";
        for (const byte of new Uint8Array(bytes)) binary += String.fromCharCode(byte);
        return btoa(binary);
      }

      function setStatus(message, state = "") {
        status.textContent = message;
        status.dataset.state = state;
      }

      async function copyCode() {
        try {
          await navigator.clipboard.writeText(result.value);
          setStatus("Код скопирован. Отправьте его Илону в этот чат.", "success");
        } catch (error) {
          result.focus();
          result.select();
          setStatus("Нажмите и удерживайте код, затем выберите «Скопировать».", "error");
        }
      }

      encryptButton.addEventListener("click", async () => {
        const token = tokenInput.value.trim();
        resultWrap.hidden = true;
        result.value = "";

        if (!/^\d{6,14}:[A-Za-z0-9_-]{25,}$/.test(token)) {
          setStatus("Проверьте токен: он должен содержать цифры, двоеточие и длинный набор символов.", "error");
          tokenInput.focus();
          return;
        }

        encryptButton.disabled = true;
        setStatus("Создаю безопасный код…");

        try {
          const key = await crypto.subtle.importKey(
            "spki",
            bytesFromBase64(publicKeyBase64),
            { name: "RSA-OAEP", hash: "SHA-256" },
            false,
            ["encrypt"],
          );
          const encrypted = await crypto.subtle.encrypt(
            { name: "RSA-OAEP" },
            key,
            new TextEncoder().encode(token),
          );
          tokenInput.value = "";
          result.value = "NELLIBOT1." + base64FromBytes(encrypted);
          resultWrap.hidden = false;
          await copyCode();
        } catch (error) {
          tokenInput.value = "";
          setStatus("Не удалось создать код. Обновите страницу и попробуйте ещё раз.", "error");
        } finally {
          encryptButton.disabled = false;
        }
      });

      copyButton.addEventListener("click", copyCode);
    })();
  </script>
</body>
</html>
