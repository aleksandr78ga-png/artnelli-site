name: Mirror catalogue to catalog-sync

on:
  workflow_run:
    workflows:
      - Sync catalogue and publish artnelli.com
    types:
      - completed
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-sync-branch-update
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Read the published catalogue
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Check out catalogue backup
        uses: actions/checkout@v4
        with:
          ref: catalog-sync
          path: backup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backup/package-lock.json
      - name: Copy the published catalogue and photographs
        shell: bash
        run: |
          set -euo pipefail
          cp published/catalog-data.js backup/catalog-data.js
          mkdir -p backup/api backup/assets/catalog
          cp published/api/live-data.js backup/api/live-data.js
          rsync --archive --delete published/assets/catalog/ backup/assets/catalog/
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const source = fs.readFileSync('backup/catalog-data.js', 'utf8');
          const products = JSON.parse(source.slice(source.indexOf('=') + 1).trim().replace(/;$/, ''));
          const state = {schemaVersion:1, source:'https://t.me/nelli_leotards', mirroredFrom:'gh-pages', productCount:products.length,
            newCount:products.filter(p=>p.condition==='new').length,
            usedCount:products.filter(p=>p.condition==='used').length,
            rentalCount:products.filter(p=>p.condition==='rental').length};
          fs.writeFileSync('backup/catalog-sync-state.json', JSON.stringify(state, null, 2) + '\n');
          JS
      - name: Install dependencies
        working-directory: backup
        run: npm ci
      - name: Build and validate catalogue backup
        working-directory: backup
        run: |
          npm run build
          npm run validate
      - name: Save verified catalogue backup
        working-directory: backup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- catalog-data.js catalog-sync-state.json api/live-data.js assets/catalog
          if git diff --cached --quiet; then
            echo "Catalogue backup is current."
          else
            git commit -m "Mirror the published catalogue"
            git push origin HEAD:catalog-sync
          fi
