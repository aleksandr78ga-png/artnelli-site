name: Validate and publish catalog-sync

on:
  workflow_dispatch:
  push:
    branches:
      - catalog-sync

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-sync-publish
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog-sync
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate
        run: |
          npm run build
          npm run validate
      - name: Publish verified site to gh-pages
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="${RUNNER_TEMP}/nelli-pages"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach "${publish_dir}" origin/gh-pages
          rsync --archive --delete \
            --exclude=".git" \
            --exclude=".github" \
            dist/client/ "${publish_dir}/"
          printf 'artnelli.com\n' > "${publish_dir}/CNAME"
          touch "${publish_dir}/.nojekyll"
          git -C "${publish_dir}" config user.name "github-actions[bot]"
          git -C "${publish_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${publish_dir}" add -A
          if git -C "${publish_dir}" diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Published site is already current."
          else
            git -C "${publish_dir}" commit -m "Publish catalog-sync"
            git -C "${publish_dir}" push origin HEAD:gh-pages
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Start protected Pages deployment
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            --data '{"ref":"gh-pages"}'
