name: Validate catalogue backup

on:
  workflow_dispatch:
  push:
    branches:
      - catalog-sync

permissions:
  contents: read

concurrency:
  group: catalog-sync-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalogue backup
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate
        run: |
          npm run build
          npm run validate

# Production is published only from main/site by the main synchronization workflow.
