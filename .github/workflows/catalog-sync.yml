name: Validate catalog-sync branch

on:
  workflow_dispatch:
  push:
    branches:
      - catalog-sync

permissions:
  contents: read

concurrency:
  group: catalog-sync-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog-sync
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate
        run: |
          npm run build
          npm run validate