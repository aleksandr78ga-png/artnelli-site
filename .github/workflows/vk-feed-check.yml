name: Validate VK source export

on:
  pull_request:
    paths:
      - "scripts/build-vk-feed.py"
      - "scripts/test-vk-feed.py"
      - "scripts/requirements-vk-feed.txt"
      - ".github/workflows/vk-feed-check.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-vk-feed.txt
      - run: python scripts/test-vk-feed.py
      - run: python scripts/build-vk-feed.py
      - name: Show export validation report
        run: cat site/feeds/vk-report.json
